# Render blueprint: one free web service.
# The free plan has no disk, so the SQLite demo data starts clean after a restart;
# every visitor gets a freshly seeded workspace anyway. A GitHub Actions job
# (.github/workflows/keep-awake.yml) pings /api/health so the service doesn't sleep.
services:
  - type: web
    name: allowance
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: MAX_RUNS_PER_DAY
        value: "300"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_VAULT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
